<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>올인원 에이전트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2E4BE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="에이전트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#F3F5F9;--panel:#FFFFFF;--ink:#18203A;--muted:#69728C;--line:#DDE2EC;--accent:#2E4BE6;--on-accent:#FFFFFF;--accent-soft:#E7EBFD;--user:#18203A;--user-ink:#F3F5F9;--danger:#C9413C;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1424;--panel:#182038;--ink:#E8ECF6;--muted:#97A0BA;--line:#2A3452;--accent:#8EA2FF;--on-accent:#0F1424;--accent-soft:#232E52;--user:#E8ECF6;--user-ink:#0F1424;--danger:#FF8A80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100dvh}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0}
.top strong{font-size:17px;letter-spacing:-.01em}
.icon-btn{background:none;border:none;padding:8px;border-radius:10px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
main{flex:1;overflow-y:auto;padding:20px 16px 8px;width:100%;max-width:720px;margin:0 auto}
.bubble{max-width:88%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;margin-bottom:12px}
.me{margin-left:auto;background:var(--user);color:var(--user-ink);border-bottom-right-radius:6px}
.bot{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
.err{border-color:var(--danger)}
.chip{display:inline-block;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px;margin:0 6px 8px 0}
.empty h1{font-size:26px;line-height:1.3;margin:16px 0 8px;letter-spacing:-.02em}
.empty p{color:var(--muted);margin:0 0 20px;font-size:15px;line-height:1.6}
.starter{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:15px;cursor:pointer}
.thinking{color:var(--muted);font-size:14px;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.bar{display:flex;gap:8px;align-items:flex-end;padding:10px 16px calc(14px + env(safe-area-inset-bottom));width:100%;max-width:720px;margin:0 auto}
.bar textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:11px 16px;font-size:16px;max-height:140px;line-height:1.45}
.round{width:44px;height:44px;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.go{background:var(--accent);color:var(--on-accent)}
.go:disabled{opacity:.35;cursor:default}
.reset{background:transparent;color:var(--muted);border:1px solid var(--line)}
dialog{border:none;border-radius:20px;padding:22px;width:min(92vw,420px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,30,.45)}
dialog h2{margin:0 0 6px;font-size:19px}
dialog p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.6}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
dialog input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.55}
</style>
</head>
<body>
<header>
  <div class="top">
    <strong>올인원 에이전트</strong>
    <button class="icon-btn" id="openSettings" aria-label="설정">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <nav class="tabs" id="tabs" aria-label="에이전트 모드"></nav>
</header>

<main id="feed"></main>

<div class="bar">
  <button class="round reset" id="reset" aria-label="새 대화" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
  </button>
  <textarea id="input" rows="1" placeholder="메시지 보내기"></textarea>
  <button class="round go" id="send" aria-label="보내기" disabled>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
  </button>
</div>

<dialog id="settings">
  <h2>설정</h2>
  <p>Anthropic API 키는 이 기기의 브라우저에만 저장되고, Anthropic 서버로만 전송됩니다.</p>
  <label for="key">API 키</label>
  <input id="key" type="password" autocomplete="off" placeholder="sk-ant-...">
  <div class="note">키는 console.anthropic.com에서 발급할 수 있어요. 사용량만큼 요금이 청구됩니다.</div>
  <label for="model">모델</label>
  <input id="model" type="text" autocomplete="off" spellcheck="false">
  <div class="row">
    <button class="btn" id="clearAll">기록 지우기</button>
    <button class="btn primary" id="saveSettings">저장</button>
  </div>
</dialog>

<script>
const DEFAULT_MODEL = "claude-sonnet-5-5";
const today = () => new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
const BASE = () => `당신은 한국어로 답하는 유능한 개인 에이전트입니다. 오늘은 ${today()}입니다. 휴대폰 화면에서 읽기 좋게 간결하게, 핵심부터 답하세요. 마크다운 표는 쓰지 마세요.`;

const MODES = [
  {id:"auto",label:"자동",web:true,hint:"무엇이든 물어보세요. 필요하면 웹 검색도 알아서 합니다.",
   prompt:()=>`${BASE()} 요청에 따라 웹 검색을 스스로 판단해 사용하고, 리서치·일정 계획·글쓰기·번역·학습 도움을 모두 직접 제공하세요.`,
   starters:["오늘 주요 IT 뉴스 알려줘","주말 서울 근교 나들이 계획 짜줘","'회의를 다음 주로 미뤄도 될까요?' 영어로"]},
  {id:"research",label:"리서치",web:true,hint:"웹을 검색해 출처와 함께 정리합니다.",
   prompt:()=>`${BASE()} 리서치 도우미로서 웹 검색을 적극 활용하고, 여러 출처를 비교해 요점을 정리한 뒤 끝에 참고한 사이트 이름을 밝혀주세요. 원문을 길게 인용하지 말고 자신의 말로 요약하세요.`,
   starters:["전기차 보조금 최신 정책 정리","요즘 많이 쓰는 노트 앱 비교","이번 달 서울 전시회 찾아줘"]},
  {id:"assistant",label:"비서",web:false,hint:"할 일 정리, 일정 계획, 메일 초안을 도와요.",
   prompt:()=>`${BASE()} 개인 비서입니다. 사용자가 알려준 할 일과 일정을 우선순위·시간대별로 정리하고, 하루·주간 계획을 세우고, 보낼 메일이나 메시지 초안을 써주세요. 사용자의 실제 메일함이나 캘린더에는 접근할 수 없으니, 필요한 정보는 사용자에게 물어보세요.`,
   starters:["오늘 할 일 정리해줘: 보고서, 장보기, 운동, 병원 예약","다음 주 공부 계획 세워줘","약속 시간 변경 요청 문자 써줘"]},
  {id:"writing",label:"글쓰기",web:false,hint:"초안 작성, 다듬기, 번역을 도와요.",
   prompt:()=>`${BASE()} 글쓰기·번역 도우미입니다. 초안 작성, 문장 다듬기, 맞춤법 교정, 자연스러운 번역을 도와주세요. 수정할 때는 고친 결과를 먼저 보여주고 주요 변경점을 짧게 덧붙이세요.`,
   starters:["퇴사 인사 메일 초안 써줘","자기소개를 일본어로 번역해줘","이 문장 더 자연스럽게: 금일 회의는 취소됨을 알려드립니다"]},
  {id:"tutor",label:"튜터",web:false,hint:"개념 설명과 퀴즈로 공부를 도와요.",
   prompt:()=>`${BASE()} 친절한 튜터입니다. 개념은 쉬운 비유와 예시로 설명하고, 원하면 한 번에 한 문제씩 퀴즈를 내세요. 답을 받으면 채점하고 짧게 해설한 뒤 다음 문제로 넘어가세요.`,
   starters:["광합성 쉽게 설명해줘","영어 단어 퀴즈 내줘","한국사 조선 초기 퀴즈 5문제"]},
];

const $ = (id) => document.getElementById(id);
const store = {
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
let modeId = store.get("mode","auto");
let msgs = store.get("msgs",[]);
let busy = false;
const mode = () => MODES.find(m=>m.id===modeId) || MODES[0];

const esc = (s) => s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rich = (s) => esc(s).replace(/^#{1,6}\s+/gm,"").replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>");

function renderTabs(){
  $("tabs").innerHTML = MODES.map(m=>`<button class="tab" data-id="${m.id}" aria-pressed="${m.id===modeId}">${m.label}</button>`).join("");
  $("input").placeholder = `${mode().label} 모드에 메시지 보내기`;
}
function render(){
  const f = $("feed");
  if(!msgs.length){
    const m = mode();
    f.innerHTML = `<div class="empty"><h1>${m.id==="auto"?"무엇을 도와드릴까요?":m.label+" 모드"}</h1><p>${m.hint}</p>${m.starters.map(s=>`<button class="starter">${esc(s)}</button>`).join("")}</div>`;
  } else {
    f.innerHTML = msgs.map(m=>{
      const chips = (m.tools||[]).map(t=>`<span class="chip">웹 검색: ${esc(t)}</span>`).join("");
      const body = m.role==="user" ? esc(m.content) : rich(m.content);
      return `<div class="bubble ${m.role==="user"?"me":"bot"} ${m.error?"err":""}">${chips?`<div>${chips}</div>`:""}${body}</div>`;
    }).join("");
  }
  if(busy) f.insertAdjacentHTML("beforeend",`<div class="thinking"><span class="dot"></span>${mode().web?"알아보는 중…":"생각하는 중…"}</div>`);
  $("reset").hidden = !msgs.length;
  $("send").disabled = busy || !$("input").value.trim();
  f.scrollTop = f.scrollHeight;
}

async function callAPI(body){
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key":store.get("key",""),
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify(body)
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok){
    const msg = data?.error?.message || `요청 실패 (${res.status})`;
    if(res.status===401) throw new Error("API 키가 올바르지 않습니다. 설정에서 키를 확인해 주세요.");
    throw new Error(msg);
  }
  return data;
}

async function send(text){
  const q = (text ?? $("input").value).trim();
  if(!q || busy) return;
  if(!store.get("key","")){ openSettings(); return; }
  msgs.push({role:"user",content:q}); $("input").value=""; autosize();
  busy = true; store.set("msgs",msgs); render();
  const m = mode();
  try{
    const messages = msgs.map(x=>({role:x.role,content:x.content}));
    const body = {model:store.get("model",DEFAULT_MODEL),max_tokens:2000,system:m.prompt(),messages};
    if(m.web) body.tools=[{type:"web_search_20250305",name:"web_search",max_uses:5}];
    let text="", tools=[];
    for(let i=0;i<3;i++){
      const data = await callAPI(body);
      const blocks = data.content||[];
      text += blocks.filter(b=>b.type==="text").map(b=>b.text).join("");
      tools.push(...blocks.filter(b=>b.type==="server_tool_use").map(b=>b.input?.query||""));
      if(data.stop_reason!=="pause_turn") break;
      body.messages = [...messages,{role:"assistant",content:blocks}];
    }
    msgs.push({role:"assistant",content:text.trim()||"응답이 비어 있습니다. 질문을 조금 바꿔 다시 보내 주세요.",tools});
  }catch(e){
    msgs.push({role:"assistant",content:`오류: ${e.message}`,error:true});
  }finally{
    busy=false; store.set("msgs",msgs.filter(x=>!x.error)); render();
  }
}

function autosize(){const t=$("input");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px";}
function openSettings(){ $("key").value=store.get("key",""); $("model").value=store.get("model",DEFAULT_MODEL); $("settings").showModal(); }

$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;modeId=b.dataset.id;store.set("mode",modeId);renderTabs();render();});
$("feed").addEventListener("click",e=>{const b=e.target.closest(".starter");if(b)send(b.textContent);});
$("send").addEventListener("click",()=>send());
$("input").addEventListener("input",()=>{autosize();$("send").disabled=busy||!$("input").value.trim();});
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&window.matchMedia("(pointer:fine)").matches){e.preventDefault();send();}});
$("reset").addEventListener("click",()=>{msgs=[];store.set("msgs",msgs);render();});
$("openSettings").addEventListener("click",openSettings);
$("saveSettings").addEventListener("click",()=>{store.set("key",$("key").value.trim());store.set("model",$("model").value.trim()||DEFAULT_MODEL);$("settings").close();});
$("clearAll").addEventListener("click",()=>{if(confirm("대화 기록을 모두 지울까요?")){msgs=[];store.set("msgs",msgs);render();$("settings").close();}});

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
renderTabs(); render();
if(!store.get("key","")) openSettings();
</script>
</body>
</html>
